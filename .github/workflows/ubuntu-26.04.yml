name: ubuntu-26.04

on:
  workflow_dispatch:
  push:
    paths-ignore:
      - .github/workflows/*.yml
      - images/Dockerfile-ubuntu-22.04
      - images/Dockerfile-ubuntu-24.04
      - images/*.cmd
      - README.md
      - LICENSE

jobs:
  ubuntu-2604:
    uses: ./.github/workflows/.ubuntu.yml
    with:
      ubuntu-version: 26.04
      arm64: false
      minimal: false
      slim: false
      instance: m8id.4xlarge:ubuntu-24.04-minimal
