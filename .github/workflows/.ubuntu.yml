name: .ubuntu

on:
  workflow_call:
    inputs:
      ubuntu-version:
        required: true
        type: string
      arm64:
        required: true
        type: boolean
      minimal:
        required: true
        type: boolean
      slim:
        required: true
        type: boolean
      instance:
        required: true
        type: string

jobs:
  build:
    runs-on:
      - sprinters:aws:${{ inputs.instance }}:spot=rerun
      - ${{ github.run_id }}-${{ github.run_attempt }}-build-${{ inputs.docker-image }}

    env:
      DOCKERFILE_NAME: images/Dockerfile-ubuntu-${{ inputs.ubuntu-version }}
      DOCKER_IMAGE: sprinters-images-ubuntu-${{ inputs.ubuntu-version }}${{ inputs.arm64 && '-arm' || '' }}${{ inputs.minimal && '-minimal' || '' }}${{ inputs.slim && '-slim' || '' }}

    steps:
      - uses: actions/checkout@v7

      # The disk usage the runner reports at the end of the job is measured after the builder has been removed, so it
      # misses the peak during the build, which is what the instance needs to be sized for. This samples it throughout.
      - name: Start disk usage sampling
        run: |
          nohup sh -c 'while true; do df -B1G --output=used "$(docker info -f "{{.DockerRootDir}}")" | tail -1; sleep 5; done' \
            > "$RUNNER_TEMP/disk-usage.log" 2>&1 &

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      # The Dockerfiles fan out into many parallel stages (one per self-contained tool, plus the
      # system-package chain), each with its own multi-GB footprint (e.g. the codeql stage alone is
      # ~9GB). Left unbounded, BuildKit runs all of them at once, and their peak combined disk usage
      # is what exhausts the runner, not any single stage. This caps how many run concurrently.
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
        with:
          buildkitd-config-inline: |
            [worker.oci]
              max-parallelism = 3
            [worker.containerd]
              max-parallelism = 3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract version from Dockerfile
        run: |
          VERSION_ARG=RUNNER_IMAGE_VERSION
          if [ "${{ inputs.arm64 }}" = "true" ]; then
            VERSION_ARG=RUNNER_IMAGE_VERSION_ARM64
          fi
          VERSION=$(grep "^ARG ${VERSION_ARG}=" "$DOCKERFILE_NAME" | cut -d '=' -f2)
          echo "RUNNER_IMAGE_VERSION: ${VERSION}"
          echo "VERSION=${VERSION}" >> $GITHUB_ENV

      # Should be changed to build, smoke-test, push once this is resolved:
      # https://github.com/docker/build-push-action/issues/1387
      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: images
          file: ${{ env.DOCKERFILE_NAME }}
          build-args: |
            RUNNER_IMAGE_VERSION=${{ env.VERSION }}
            MINIMAL=${{ inputs.minimal }}
            SLIM=${{ inputs.slim }}
          platforms: ${{ inputs.arm64 && 'linux/arm64' || 'linux/amd64' }}
          load: true
          push: true
          tags: |
            ghcr.io/sprinters-sh/${{ env.DOCKER_IMAGE }}:latest
            ghcr.io/sprinters-sh/${{ env.DOCKER_IMAGE }}:${{ env.VERSION }}

      - name: Smoke test
        env:
          DOCKER_TAG: ghcr.io/sprinters-sh/${{ env.DOCKER_IMAGE }}:${{ env.VERSION }}
        run: docker run --rm $DOCKER_TAG ./config.sh --version

      - name: Report peak disk usage
        if: always()
        run: |
          size=$(df -B1G --output=size "$(docker info -f '{{.DockerRootDir}}')" | tail -1 | tr -d ' ')
          peak=$(sort -n "$RUNNER_TEMP/disk-usage.log" | tail -1 | tr -d ' ')
          echo "Peak disk usage: ${peak} GiB of ${size} GiB ($((100 * peak / size))%)"
